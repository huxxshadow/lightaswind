<script>
  // Pick the language before first paint: saved choice, else the browser's.
  (function () {
    var ok = { zh: 1, en: 1, ja: 1, ko: 1 }, l = null;
    try { l = localStorage.getItem("law-lang"); } catch (e) {}
    if (!ok[l]) {
      var list = navigator.languages || [navigator.language || "en"];
      for (var i = 0; i < list.length && !ok[l]; i++) {
        var c = String(list[i]).toLowerCase().slice(0, 2);
        if (ok[c]) l = c;
      }
    }
    document.documentElement.setAttribute("data-lang", ok[l] ? l : "en");
  })();
</script>
